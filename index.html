<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#9BD770">
<title>Lili Runs Wild</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>
<canvas id="hud"></canvas>
<div id="ui">
  <button id="btn-book" class="round" aria-label="Sticker book">
    <svg viewBox="0 0 24 24" width="34" height="34">
      <path d="M12 2.6l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17l-5.7 3.1 1.2-6.4L2.8 9.3l6.4-.8z" fill="#fff" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>
    </svg>
    <span id="book-n">0</span>
  </button>
  <button id="btn-mute" class="round small" aria-label="Sound">
    <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 9.5v5h3.5l4.5 4v-13l-4.5 4z" fill="#fff"/>
      <g id="mute-waves"><path d="M15.5 9.5a3.5 3.5 0 0 1 0 5"/><path d="M18 7a7 7 0 0 1 0 10"/></g>
      <g id="mute-cross" style="display:none"><path d="M16 9.5l5 5M21 9.5l-5 5"/></g>
    </svg>
  </button>
  <div id="keys">arrows / WASD run &nbsp;·&nbsp; space jump &nbsp;·&nbsp; B bark &nbsp;·&nbsp; E car &nbsp;·&nbsp; or click where she should go</div>
  <div id="actions">
    <button id="btn-car" class="round big car hidden" aria-label="Car">
      <svg viewBox="0 0 48 48" width="58%" height="58%" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"><circle cx="24" cy="24" r="17"/><circle cx="24" cy="24" r="3.5" fill="#fff"/><path d="M24 24v17M24 24L9.5 16M24 24l14.5-8"/></svg>
    </button>
    <button id="btn-bark" class="round big bark" aria-label="Bark">
    <!-- a dog's head barking: mouth open, ear flopping, shout lines. Not words (the children cannot read) and not a
         loudspeaker (that read as the sound switch) -->
    <svg viewBox="0 0 48 48" width="84%" height="84%">
      <path d="M5 25C5 16.5 11 11 18.5 11c5 0 8.5 2.6 10.2 6.3L35.6 18c2.3.2 3.6 1.7 3.6 3.6 0 2.1-1.4 3.6-3.6 3.8L27 26.6c-2.2 4.6-6 8-10.8 8C9.6 34.6 5 30.6 5 25z" fill="#fff"/>
      <path d="M26.3 29.4l8.6 3.1c1.7.6 1.3 3.9-.8 3.7l-9.6-1.5c-2-.4-1.4-5.8 1.8-5.3z" fill="#fff"/>
      <path d="M9.6 15.4c-3.6 2.4-5.3 9-4 15.6.7 3.6 5.6 3.9 6.6.3 1.3-4.7 1.8-10.7.6-14.9-.5-1.6-2-2-3.2-1z" fill="#fff" stroke="#FF7FA0" stroke-width="1.8"/>
      <circle cx="22.4" cy="19.2" r="2.1" fill="#FF7FA0"/>
      <circle cx="37.3" cy="20.4" r="1.6" fill="#FF7FA0"/>
      <g stroke="#fff" stroke-width="3.2" stroke-linecap="round"><path d="M40.8 26.8l4.6-2.4"/><path d="M41.6 31.6h5"/><path d="M40.6 36.2l4.4 2.6"/></g>
    </svg>
    </button>
    <button id="btn-jump" class="round big jump" aria-label="Jump">
      <svg viewBox="0 0 48 48" width="60%" height="60%" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M24 40V10M11 22L24 9l13 13"/></svg>
    </button>
  </div>
</div>
<!-- the title: the town lives behind it, Lili at her door; any tap or key plays -->
<div id="title" class="hidden">
  <h1 aria-label="Lili Runs Wild"><span class="lili">Lili</span><span class="wild">Runs Wild</span></h1>
  <button id="btn-play" class="round" aria-label="Play">
    <svg viewBox="0 0 48 48" width="56%" height="56%"><path d="M17 10.5 38 24 17 37.5z" fill="#fff" stroke="#fff" stroke-width="6" stroke-linejoin="round"/></svg>
  </button>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
